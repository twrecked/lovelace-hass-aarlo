name: Validate & Lint

on:
  push:
    branches:
      - main
      - 'version-*'
  pull_request:

jobs:
  validate:
    name: Build & HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Lovelace Card
        run: npm run build

      - name: HACS Validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
