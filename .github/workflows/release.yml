name: Release Assets

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Bundle
        run: npm run build

      - name: Gzip Bundle
        run: gzip -k -9 dist/hass-aarlo.js

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hass-aarlo.js
            dist/hass-aarlo.js.map
            dist/hass-aarlo.js.gz
