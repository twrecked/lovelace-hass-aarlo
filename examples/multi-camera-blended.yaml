# Modern Aarlo Glance Card - Multi-Camera with Blended Recordings (v0.4.0+)
# Combines multiple cameras into a single swipeable card with shared library feed.

type: custom:aarlo-glance
global: active,blended
image_view: numeric
image_top: name,status|date
image_bottom: motion,battery,signal|stream,snapshot,library
image_click: stream
library_view: duration,download
library_sizes: 2,3,4
entities:
  - entity: camera.aarlo_driveway
    name: Driveway
    light: light.driveway_floodlight
  - entity: camera.aarlo_front_door
    name: Front Door
    door_lock: lock.front_door
  - entity: camera.aarlo_backyard
    name: Backyard
